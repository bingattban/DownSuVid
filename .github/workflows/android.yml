name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-pip python3-dev \
            openjdk-17-jdk autoconf automake libtool \
            libffi-dev libssl-dev zlib1g-dev cmake ninja-build \
            pkg-config libltdl-dev
      
      - name: Install 32-bit libs
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libncurses5:i386 libstdc++6:i386 zlib1g:i386
      
      - name: Install Python packages
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython
      
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.cache/pip
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      
      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log
      
      - name: Check APK
        run: |
          echo "=== Checking for APK ==="
          ls -la bin/ || echo "bin/ not found"
          ls -la .buildozer/ || echo ".buildozer/ not found"
          if ls bin/*.apk 2>/dev/null; then
            echo "APK found!"
            ls -lh bin/*.apk
          else
            echo "APK not found in bin/"
            find . -name "*.apk" 2>/dev/null || echo "No APK files found anywhere"
            echo "=== Build log (last 100 lines) ==="
            tail -100 build.log || echo "No build log"
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DownSuVid-APK
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
