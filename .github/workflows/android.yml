name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DownSuVid APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            git \
            python3-pip \
            python3-dev \
            python3-setuptools \
            autoconf \
            automake \
            libtool \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            cmake \
            ninja-build \
            pkg-config \
            libltdl-dev \
            ccache \
            libncurses-dev \
            libtinfo-dev

      - name: Install 32-bit libraries
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libncurses-dev:i386 \
            libstdc++6:i386 \
            zlib1g:i386 2>/dev/null || echo "Some 32-bit libs skipped"

      - name: Upgrade pip and install build tools
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0
          pip install cython==0.29.36
          pip install virtualenv

      - name: Verify buildozer installation
        run: |
          buildozer version
          echo "Buildozer installed successfully"

      - name: Cache Buildozer dependencies
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.cache/pip
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'main.py') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Create required directories
        run: |
          mkdir -p assets/icons
          mkdir -p assets/splash

      - name: Generate placeholder assets
        run: |
          python3 -c "
          import struct, zlib
          
          def create_minimal_png(filename, r=26, g=35, b=126):
              def chunk(chunk_type, data):
                  c = chunk_type + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              
              raw_data = b'\x00' + bytes([r, g, b, 255])
              
              header = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', 1, 1, 8, 6, 0, 0, 0))
              idat = chunk(b'IDAT', zlib.compress(raw_data))
              iend = chunk(b'IEND', b'')
              
              with open(filename, 'wb') as f:
                  f.write(header + ihdr + idat + iend)
          
          create_minimal_png('assets/icons/icon.png', 0, 150, 136)
          create_minimal_png('assets/splash/splash.png', 26, 35, 126)
          print('Placeholder assets created')
          "

      - name: Verify main.py syntax
        run: |
          python3 -m py_compile main.py
          echo "main.py syntax OK"

      - name: Accept Android SDK licenses
        run: |
          # Create Android SDK directory
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          mkdir -p $HOME/.android
          
          # Accept all licenses automatically
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          
          # Also for standard location
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.android/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > $HOME/.android/android-sdk-preview-license
          
          echo "Android SDK licenses accepted"

      - name: Build APK with Buildozer
        id: build
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          echo "Starting Buildozer build..."
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          
          # Run buildozer
          buildozer android debug 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "Buildozer failed with exit code $BUILD_EXIT_CODE"
            echo "=== Last 100 lines of build log ==="
            tail -100 build.log
            
            # Check for license issues
            if grep -q "license" build.log; then
              echo "=== License issue detected ==="
              ls -la $HOME/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || echo "No licenses dir"
              ls -la $HOME/.android/ 2>/dev/null || echo "No .android dir"
            fi
            
            exit 1
          fi

      - name: Locate APK file
        id: locate
        run: |
          echo "Searching for APK..."
          
          if ls bin/*.apk 2>/dev/null; then
            APK_PATH=$(ls bin/*.apk | head -1)
            echo "APK found at: $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            ls -lh "$APK_PATH"
          elif find .buildozer -name "*.apk" -not -path "*unaligned*" 2>/dev/null | head -1; then
            APK_PATH=$(find .buildozer -name "*.apk" -not -path "*unaligned*" | head -1)
            echo "APK found at: $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            ls -lh "$APK_PATH"
          else
            echo "APK not found"
            echo "Searching all directories..."
            find . -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownSuVid-APK
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 30
          compression-level: 6
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            build.log
            .buildozer/android/platform/python-for-android/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          echo "============================================"
          echo "Build completed at $(date)"
          echo "Runner: ${{ runner.os }}"
          echo "Python: $(python3 --version)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "============================================"
