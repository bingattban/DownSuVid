name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DownSuVid APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git python3-pip python3-dev python3-setuptools \
            autoconf automake libtool libffi-dev libssl-dev zlib1g-dev \
            cmake ninja-build pkg-config libltdl-dev ccache \
            libncurses-dev libtinfo-dev unzip wget

      - name: Install 32-bit libraries
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libncurses-dev:i386 libstdc++6:i386 zlib1g:i386 2>/dev/null || echo "Some 32-bit libs skipped"

      - name: Upgrade pip and install build tools
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0
          pip install cython==0.29.36
          pip install virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.cache/pip
            ~/.buildozer
          key: buildozer-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'main.py') }}
          restore-keys: buildozer-v3-${{ runner.os }}-

      - name: Create assets
        run: |
          mkdir -p assets/icons assets/splash
          python3 -c "
          import struct, zlib
          def png(filename, r, g, b):
              def chunk(t, d):
                  c = t + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              raw = b'\x00' + bytes([r, g, b, 255])
              h = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 1, 1, 8, 6, 0, 0, 0))
              h += chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
              with open(filename, 'wb') as f: f.write(h)
          png('assets/icons/icon.png', 0, 150, 136)
          png('assets/splash/splash.png', 26, 35, 126)
          "

      - name: Verify main.py
        run: |
          python3 -m py_compile main.py && echo "Syntax OK"

      - name: Setup Android SDK and accept licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          
          # Download commandline tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p "$SDK/cmdline-tools"
          mv cmdline-tools "$SDK/cmdline-tools/latest"
          
          # Set PATH
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          
          # Create license files FIRST (before any sdkmanager call)
          mkdir -p "$SDK/licenses"
          
          # Android SDK License (the long hash is the accepted license key)
          cat > "$SDK/licenses/android-sdk-license" << 'LICENSE'
          
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          LICENSE
          
          # Android SDK Preview License
          cat > "$SDK/licenses/android-sdk-preview-license" << 'LICENSE'
          
          84831b9409646a918e30573bab4c9c91346d8abd
          504667f4c0de7af1a06de9f4b1727b84351f2910
          LICENSE
          
          # Google Maven License
          cat > "$SDK/licenses/android-googletv-license" << 'LICENSE'
          
          601085b94cd77f0b54ff86406957099ebe79c4d6
          LICENSE
          
          # Accept licenses via sdkmanager
          yes | sdkmanager --licenses 2>/dev/null || true
          
          # Install required packages
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.0" 2>/dev/null || true
          
          # Verify installation
          echo "=== SDK Structure ==="
          ls -la "$SDK/"
          ls -la "$SDK/licenses/"
          ls -la "$SDK/platforms/" 2>/dev/null || echo "No platforms"
          ls -la "$SDK/build-tools/" 2>/dev/null || echo "No build-tools"
          echo "=== sdkmanager check ==="
          which sdkmanager || echo "sdkmanager not in PATH"
          find "$SDK" -name "sdkmanager" 2>/dev/null

      - name: Build APK
        id: build
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          echo "=== Building APK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          
          # Ensure license files exist
          mkdir -p "$ANDROID_HOME/licenses"
          for f in android-sdk-license android-sdk-preview-license; do
            if [ ! -f "$ANDROID_HOME/licenses/$f" ]; then
              echo "Recreating $f"
              cp "$ANDROID_HOME/licenses/"* "$ANDROID_HOME/licenses/" 2>/dev/null || true
            fi
          done
          
          # Also create in home .android
          mkdir -p ~/.android
          cp "$ANDROID_HOME/licenses/android-sdk-license" ~/.android/ 2>/dev/null || true
          
          # Run buildozer
          buildozer android debug 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== Build failed ==="
            tail -80 build.log
            exit 1
          fi
          
          echo "=== Build successful ==="

      - name: Locate and upload APK
        id: locate
        run: |
          APK=$(find . -name "*.apk" -not -name "*unaligned*" -not -name "*unsigned*" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "APK: $APK"
            echo "apk_path=$APK" >> $GITHUB_OUTPUT
            ls -lh "$APK"
          else
            echo "APK not found!"
            find . -name "*.apk" 2>/dev/null || echo "No APK anywhere"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DownSuVid-APK
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 30
          compression-level: 6
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
