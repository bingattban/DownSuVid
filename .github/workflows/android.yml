name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DownSuVid APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget curl build-essential autoconf automake libtool pkg-config cmake ninja-build ccache libffi-dev libssl-dev zlib1g-dev libncurses-dev libltdl-dev

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer
        run: |
          python -m pip install buildozer==1.5.0 "Cython<3" virtualenv

      - name: Verify installation
        run: |
          python --version
          pip --version
          buildozer version

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec','**/*.py') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Create required assets
        run: |
          mkdir -p assets/icons assets/splash
          python3 - <<'PY'
          from pathlib import Path
          import struct,zlib
          def chunk(k,d):
              c=k+d
              return struct.pack(">I",len(d))+c+struct.pack(">I",zlib.crc32(c)&0xffffffff)
          def png(path,r,g,b):
              raw=b"\x00"+bytes([r,g,b,255])
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack(">IIBBBBB",1,1,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
              Path(path).write_bytes(data)
          png("assets/icons/icon.png",0,150,136)
          png("assets/splash/splash.png",26,35,126)
          print("Placeholder assets created")
          PY

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0 || { tail -200 build.log; exit 1; }

      - name: Locate APK
        id: apk
        run: |
          APK=$(find . -type f -name "*.apk" ! -name "*unaligned*" ! -name "*unsigned*" | head -n1)
          test -n "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DownSuVid-APK
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            .buildozer/logs/**
